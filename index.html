<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥕 Tiny Farm Factory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI","Kanit",sans-serif;
    background:linear-gradient(160deg,#ffe9c7,#cdf3d0);margin:0;padding:20px;
    display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{margin:10px 0 20px;color:#4a3419;text-align:center}
  .card{background:#fff;padding:26px;border-radius:18px;
    box-shadow:0 6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;
    gap:12px;width:320px;max-width:100%}
  input{padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;outline:none;width:100%}
  input:focus{border-color:#ff9d4d}
  button{padding:12px 20px;border:none;border-radius:10px;background:#ff9d4d;
    color:#fff;font-weight:bold;font-size:16px;cursor:pointer;font-family:inherit}
  button:hover{background:#f58a30}
  button.ghost{background:#e6e0d6;color:#5b4a33}
  button.ghost:hover{background:#d8d0c2}
  button.green{background:#4caf50}button.green:hover{background:#3f9142}
  .err{color:#d33;font-size:14px;min-height:18px}
  .muted{color:#7a6a55;font-size:13px;text-align:center}
  .hidden{display:none!important}

  /* เกมคนงาน */
  #game-wrap{position:relative;width:100%;max-width:700px;height:500px;
    border-radius:16px;overflow:hidden;background:linear-gradient(#bfe9ff,#d8f5c4);
    box-shadow:0 4px 20px rgba(0,0,0,.15);touch-action:none}
  #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;
    justify-content:space-between;font-weight:bold;font-size:17px;
    background:rgba(255,255,255,.8);padding:6px 14px;border-radius:12px;z-index:5}
  #gameCanvas{width:100%;height:100%;display:block;cursor:none}
  #gameOverBox{position:absolute;inset:0;background:rgba(0,0,0,.82);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:8px;text-align:center;z-index:10;overflow-y:auto;padding:24px}
  #gameOverBox select{padding:10px;border-radius:8px;font-size:15px;width:240px}
  #leaderboardList{text-align:left;padding-left:22px;margin:0}

  /* ฟาร์มบริษัท */
  #farm-screen{width:100%;max-width:720px}
  .bar{display:flex;justify-content:space-between;align-items:center;
    background:#fff;padding:12px 18px;border-radius:14px;margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);flex-wrap:wrap;gap:8px}
  .coins{font-size:20px;font-weight:bold;color:#c47f00}
  .shop{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .seed{background:#fff;border:3px solid transparent;border-radius:14px;
    padding:10px 14px;cursor:pointer;text-align:center;min-width:104px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);font-size:13px;color:#5b4a33}
  .seed.sel{border-color:#ff9d4d;background:#fff6ec}
  .seed .big{font-size:28px;display:block}
  .plots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .plot{background:#a9743f;border:4px solid #8a5c2f;border-radius:14px;
    height:120px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;cursor:pointer;color:#fff;font-size:13px;
    text-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .1s}
  .plot:hover{transform:translateY(-3px)}
  .plot .big{font-size:38px}
  .plot.ready{background:#4f9d4f;border-color:#3d7d3d}
  @media(max-width:520px){.plots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<h1 id="pageTitle">🥕 Tiny Farm Factory</h1>

<!-- เลือกบทบาท -->
<div id="role-screen" class="card">
  <button id="btnWorker">👷 เข้าสู่ระบบ: คนงาน</button>
  <button id="btnCompany" class="ghost">🏢 เข้าสู่ระบบ: บริษัท</button>
  <p class="muted">คนงานเล่นเกมหาคะแนน → โอนให้บริษัทเอาไปปลูกผัก</p>
</div>

<!-- คนงาน -->
<div id="worker-login" class="card hidden">
  <input id="workerName" placeholder="ชื่อคนงาน..." maxlength="20">
  <button id="workerGo">เริ่มเล่น</button>
  <button class="ghost back">← ย้อนกลับ</button>
  <div class="err" id="workerErr"></div>
</div>

<!-- บริษัท: ชื่อ -->
<div id="company-login" class="card hidden">
  <input id="companyName" placeholder="ชื่อบริษัท..." maxlength="24">
  <button id="companyNext">ถัดไป</button>
  <button class="ghost back">← ย้อนกลับ</button>
  <div class="err" id="companyErr"></div>
</div>

<!-- บริษัท: รหัสผ่าน -->
<div id="pass-screen" class="card hidden">
  <p class="muted" id="passMsg"></p>
  <input id="passInput" type="password" placeholder="รหัสผ่าน" maxlength="40">
  <input id="passConfirm" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" maxlength="40">
  <button id="passGo">ยืนยัน</button>
  <button class="ghost back">← ย้อนกลับ</button>
  <div class="err" id="passErr"></div>
</div>

<!-- เกมคนงาน -->
<div id="game-screen" class="hidden">
  <div id="game-wrap">
    <div id="hud">
      <span>👤 <span id="hud-name"></span></span>
      <span>⭐ <span id="hud-score">30</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverBox" class="hidden">
      <h2>😵 เกมจบแล้ว!</h2>
      <p>คะแนนสูงสุด: <b><span id="finalScore">0</span></b></p>
      <p style="margin:4px 0">โอนคะแนนเข้าบริษัท:</p>
      <select id="companySelect"></select>
      <button id="transferBtn" class="green">💸 โอนคะแนน</button>
      <div id="transferMsg" style="font-size:14px"></div>
      <button id="restartBtn">🔁 เล่นใหม่</button>
      <h3 style="margin:10px 0 4px">🏆 อันดับคนงาน</h3>
      <ol id="leaderboardList"></ol>
    </div>
  </div>
  <p class="muted" style="margin-top:12px">เลื่อนเมาส์ / ลากนิ้ว รับผัก 🥕 หลบหนอน 🐛 (คะแนน 0 = แพ้)</p>
</div>

<!-- ฟาร์มบริษัท -->
<div id="farm-screen" class="hidden">
  <div class="bar">
    <span>🏢 <b id="farmName"></b></span>
    <span class="coins">🪙 <span id="farmCoins">0</span></span>
    <button class="ghost" id="logoutBtn" style="padding:8px 14px;font-size:14px">ออกจากระบบ</button>
  </div>
  <div class="shop" id="shop"></div>
  <div class="plots" id="plots"></div>
  <p class="muted" style="margin-top:14px">เลือกเมล็ดด้านบน → คลิกแปลงว่างเพื่อปลูก → รอจนสุก → คลิกเก็บเกี่ยว</p>
</div>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL = "https://liuetggqgvhyfyjdjuck.supabase.co";
const SUPABASE_KEY = "sb_publishable_dGq6ZrgoxcooBoT2-Y7-GQ_DODw_Deh";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const show = id => { ['role-screen','worker-login','company-login','pass-screen','game-screen','farm-screen']
  .forEach(s => $(s).classList.toggle('hidden', s !== id)); };

/* ================= ข้อมูลพืช ================= */
const CROPS = {
  carrot:   {emoji:'🥕', name:'แครอท',     cost:50,  hours:1, sell:90},
  tomato:   {emoji:'🍅', name:'มะเขือเทศ', cost:80,  hours:2, sell:170},
  corn:     {emoji:'🌽', name:'ข้าวโพด',   cost:130, hours:3, sell:290},
  broccoli: {emoji:'🥦', name:'บรอกโคลี',  cost:200, hours:4, sell:470},
};
const PLOT_COUNT = 6;

/* ================= Navigation ================= */
$('btnWorker').onclick  = () => show('worker-login');
$('btnCompany').onclick = () => show('company-login');
document.querySelectorAll('.back').forEach(b => b.onclick = () => show('role-screen'));

/* ================= คนงาน ================= */
let currentUser = null, lastScoreId = null;

$('workerGo').onclick = () => {
  const n = $('workerName').value.trim();
  if (!n) { $('workerErr').textContent = 'กรุณาใส่ชื่อคนงาน'; return; }
  $('workerErr').textContent = '';
  currentUser = n;
  show('game-screen');
  startGame();
};
$('workerName').onkeydown = e => { if (e.key === 'Enter') $('workerGo').click(); };

/* ================= บริษัท ================= */
let company = null, pendingName = null, isNewCompany = false;

$('companyNext').onclick = async () => {
  const n = $('companyName').value.trim();
  if (!n) { $('companyErr').textContent = 'กรุณาใส่ชื่อบริษัท'; return; }
  $('companyErr').textContent = 'กำลังตรวจสอบ...';
  const { data } = await db.from('companies').select('id').eq('name', n).maybeSingle();
  $('companyErr').textContent = '';
  pendingName = n;
  isNewCompany = !data;
  $('passMsg').textContent = isNewCompany
    ? `บริษัท "${n}" ยังไม่มีในระบบ — ตั้งรหัสผ่านใหม่`
    : `ยินดีต้อนรับกลับ "${n}" — กรอกรหัสผ่าน`;
  $('passConfirm').classList.toggle('hidden', !isNewCompany);
  $('passInput').value = ''; $('passConfirm').value = ''; $('passErr').textContent = '';
  show('pass-screen');
};
$('companyName').onkeydown = e => { if (e.key === 'Enter') $('companyNext').click(); };

$('passGo').onclick = async () => {
  const pw = $('passInput').value;
  if (!pw) { $('passErr').textContent = 'กรอกรหัสผ่านก่อนครับ'; return; }
  if (isNewCompany) {
    if (pw !== $('passConfirm').value) { $('passErr').textContent = 'รหัสผ่านไม่ตรงกัน'; return; }
    const { data, error } = await db.from('companies')
      .insert({ name: pendingName, password: pw, coins: 0 }).select().single();
    if (error) { $('passErr').textContent = 'สร้างบริษัทไม่สำเร็จ'; return; }
    company = data;
    const rows = Array.from({length: PLOT_COUNT}, (_, i) => ({ company_id: company.id, slot: i }));
    await db.from('plots').insert(rows);
  } else {
    const { data } = await db.from('companies')
      .select('*').eq('name', pendingName).eq('password', pw).maybeSingle();
    if (!data) { $('passErr').textContent = 'รหัสผ่านไม่ถูกต้อง'; return; }
    company = data;
  }
  show('farm-screen');
  initFarm();
};
$('passInput').onkeydown = e => { if (e.key === 'Enter' && !isNewCompany) $('passGo').click(); };
$('passConfirm').onkeydown = e => { if (e.key === 'Enter') $('passGo').click(); };

$('logoutBtn').onclick = () => { company = null; clearInterval(farmTimer); show('role-screen'); };

/* ================= ฟาร์ม ================= */
let selectedCrop = 'carrot', plots = [], farmTimer = null;

function renderShop() {
  $('shop').innerHTML = Object.entries(CROPS).map(([k, c]) => `
    <div class="seed ${k===selectedCrop?'sel':''}" data-crop="${k}">
      <span class="big">${c.emoji}</span>${c.name}<br>🪙${c.cost} · ${c.hours}ชม.<br>ขาย ${c.sell}
    </div>`).join('');
  document.querySelectorAll('.seed').forEach(el =>
    el.onclick = () => { selectedCrop = el.dataset.crop; renderShop(); });
}

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms/1000));
  return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function renderPlots() {
  const now = Date.now();
  $('plots').innerHTML = Array.from({length: PLOT_COUNT}, (_, i) => {
    const p = plots.find(x => x.slot === i);
    if (!p || !p.crop) return `<div class="plot" data-slot="${i}"><span class="big">🟫</span>แปลงว่าง</div>`;
    const c = CROPS[p.crop], left = new Date(p.ready_at).getTime() - now;
    return left <= 0
      ? `<div class="plot ready" data-slot="${i}"><span class="big">${c.emoji}</span>✅ เก็บเกี่ยว +${c.sell}</div>`
      : `<div class="plot" data-slot="${i}"><span class="big">🌱</span>${c.name}<br>${fmt(left)}</div>`;
  }).join('');
  document.querySelectorAll('.plot').forEach(el =>
    el.onclick = () => handlePlot(Number(el.dataset.slot)));
}

async function handlePlot(slot) {
  const p = plots.find(x => x.slot === slot);
  if (p && p.crop) {
    if (new Date(p.ready_at).getTime() > Date.now()) return;
    const gain = CROPS[p.crop].sell;
    await db.from('plots').update({ crop: null, ready_at: null })
      .eq('company_id', company.id).eq('slot', slot);
    const { data } = await db.rpc('add_coins', { p_company_id: company.id, p_amount: gain });
    company.coins = data;
  } else {
    const c = CROPS[selectedCrop];
    const { data } = await db.rpc('spend_coins', { p_company_id: company.id, p_amount: c.cost });
    if (data === -1) { alert('🪙 เหรียญไม่พอ! ให้คนงานโอนคะแนนมาเพิ่มก่อนครับ'); return; }
    company.coins = data;
    const readyAt = new Date(Date.now() + c.hours*3600*1000).toISOString();
    await db.from('plots').upsert(
      { company_id: company.id, slot, crop: selectedCrop, ready_at: readyAt },
      { onConflict: 'company_id,slot' });
  }
  await loadFarm();
}

async function loadFarm() {
  const { data: co } = await db.from('companies').select('*').eq('id', company.id).single();
  if (co) company = co;
  const { data } = await db.from('plots').select('*').eq('company_id', company.id);
  plots = data || [];
  $('farmName').textContent = company.name;
  $('farmCoins').textContent = company.coins;
  renderPlots();
}

function initFarm() {
  renderShop(); loadFarm();
  clearInterval(farmTimer);
  farmTimer = setInterval(renderPlots, 1000);
}

/* ================= เกมจับผัก ================= */
const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');
const GOOD = ['🥕','🥦','🍅','🥒','🌽','🥬','🍆'], BAD = ['🐛','🪱','🤢'];
let items=[], score=30, peakScore=30, mouseX=0;
let gameRunning=false, elapsed=0, spawnTimer=0, lastTime=0;

function resizeCanvas(){ canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; }
window.addEventListener('resize', resizeCanvas);
canvas.addEventListener('mousemove', e => mouseX = e.clientX - canvas.getBoundingClientRect().left);
canvas.addEventListener('touchmove', e => mouseX = e.touches[0].clientX - canvas.getBoundingClientRect().left, {passive:true});

function spawnItem(){
  const isBad = elapsed > 10000 && Math.random() < Math.min(.5, elapsed/40000);
  const pool = isBad ? BAD : GOOD;
  items.push({ x: Math.random()*(canvas.width-40)+20, y:-30,
    speed: 2 + Math.random()*2 + elapsed/15000,
    emoji: pool[Math.floor(Math.random()*pool.length)], bad:isBad });
}
const charX = () => Math.max(0, Math.min(mouseX-20, canvas.width-40));

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font='32px serif'; items.forEach(i => ctx.fillText(i.emoji, i.x, i.y));
  ctx.font='40px serif'; ctx.fillText('🧑‍🌾', charX(), canvas.height-20);
}
function checkCollisions(){
  const cx = charX()+20, cy = canvas.height-30;
  items = items.filter(it => {
    if (Math.abs(it.x-cx)<34 && Math.abs(it.y-cy)<34) {
      score += it.bad ? -15 : 10;
      if (score < 0) score = 0;
      peakScore = Math.max(peakScore, score);
      $('hud-score').textContent = score;
      if (score <= 0) endGame();
      return false;
    }
    return it.y < canvas.height + 40;
  });
}
function gameLoop(ts){
  if (!gameRunning) return;
  const dt = ts - lastTime; lastTime = ts; elapsed += dt; spawnTimer += dt;
  if (spawnTimer > Math.max(300, 900 - elapsed/60)) { spawnItem(); spawnTimer = 0; }
  items.forEach(i => i.y += i.speed);
  draw(); checkCollisions();
  requestAnimationFrame(gameLoop);
}
function startGame(){
  resizeCanvas();
  score=30; peakScore=30; items=[]; elapsed=0; spawnTimer=0; lastScoreId=null;
  mouseX = canvas.width/2;
  $('hud-name').textContent = currentUser;
  $('hud-score').textContent = score;
  $('transferMsg').textContent = '';
  $('transferBtn').disabled = false;
  $('gameOverBox').classList.add('hidden');
  gameRunning = true; lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

async function endGame(){
  if (!gameRunning) return;
  gameRunning = false;
  $('finalScore').textContent = peakScore;
  $('gameOverBox').classList.remove('hidden');
  const { data } = await db.from('scores')
    .insert({ username: currentUser, score: peakScore }).select().single();
  if (data) lastScoreId = data.id;
  loadCompanyOptions();
  loadLeaderboard();
}

async function loadCompanyOptions(){
  const sel = $('companySelect');
  const { data } = await db.from('companies').select('id, name').order('name');
  sel.innerHTML = (data && data.length)
    ? data.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
    : '<option value="">— ยังไม่มีบริษัท —</option>';
}

$('transferBtn').onclick = async () => {
  const cid = $('companySelect').value;
  if (!cid) { $('transferMsg').textContent = '❌ ยังไม่มีบริษัทให้โอน'; return; }
  $('transferBtn').disabled = true;
  await db.rpc('add_coins', { p_company_id: Number(cid), p_amount: peakScore });
  if (lastScoreId) await db.from('scores').update({ company_id: Number(cid) }).eq('id', lastScoreId);
  const name = $('companySelect').selectedOptions[0].textContent;
  $('transferMsg').textContent = `✅ โอน ${peakScore} แต้มให้ "${name}" แล้ว`;
};

async function loadLeaderboard(){
  const list = $('leaderboardList');
  list.innerHTML = '<li>กำลังโหลด...</li>';
  const { data } = await db.from('scores').select('username, score')
    .order('score', { ascending: false }).limit(10);
  list.innerHTML = (data && data.length)
    ? data.map(r => `<li>${r.username} — ${r.score} แต้ม</li>`).join('')
    : '<li>ยังไม่มีคะแนน</li>';
}

$('restartBtn').onclick = startGame;
</script>
</body>
</html>
