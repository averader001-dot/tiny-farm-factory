<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥕 จับผักจากฟ้า - Tiny Farm Factory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Kanit", sans-serif;
    background: linear-gradient(160deg, #ffe9c7, #cdf3d0);
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  h1 { margin: 10px 0 20px; color: #4a3419; }

  /* ---------- หน้า Login ---------- */
  #login-screen {
    background: white; padding: 30px; border-radius: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    display: flex; flex-direction: column; gap: 12px; width: 300px;
  }
  #username-input {
    padding: 12px; font-size: 16px; border: 2px solid #ddd;
    border-radius: 10px; outline: none;
  }
  #username-input:focus { border-color: #ff9d4d; }
  button {
    padding: 12px 24px; border: none; border-radius: 10px;
    background: #ff9d4d; color: white; font-weight: bold;
    font-size: 16px; cursor: pointer;
  }
  button:hover { background: #f58a30; }
  #login-error { color: #d33; font-size: 14px; min-height: 18px; }

  /* ---------- เกม ---------- */
  #game-wrap {
    position: relative; width: 100%; max-width: 700px; height: 500px;
    margin: 0 auto; border-radius: 16px; overflow: hidden;
    background: linear-gradient(#bfe9ff, #d8f5c4);
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    touch-action: none;
  }
  #hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-weight: bold; font-size: 18px;
    background: rgba(255,255,255,.8);
    padding: 6px 14px; border-radius: 12px; z-index: 5;
  }
  #gameCanvas { width: 100%; height: 100%; display: block; cursor: none; }
  #gameOverBox {
    position: absolute; inset: 0; background: rgba(0,0,0,.78);
    color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    text-align: center; z-index: 10; overflow-y: auto; padding: 20px;
  }
  #gameOverBox h2 { margin: 0; }
  #gameOverBox h3 { margin: 10px 0 4px; }
  #leaderboardList { text-align: left; padding-left: 24px; margin: 0; }
  #leaderboardList li { margin: 2px 0; }
  .hidden { display: none !important; }
  .hint { color: #6b5a42; font-size: 14px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<h1>🥕 จับผักจากฟ้า</h1>

<!-- ---------- หน้า Login ---------- -->
<div id="login-screen">
  <input type="text" id="username-input" placeholder="ตั้งชื่อผู้เล่น..." maxlength="20">
  <button id="loginBtn">เริ่มเล่น</button>
  <div id="login-error"></div>
</div>

<!-- ---------- หน้าเกม ---------- -->
<div id="game-screen" class="hidden">
  <div id="game-wrap">
    <div id="hud">
      <span>👤 <span id="hud-name"></span></span>
      <span>⭐ คะแนน: <span id="hud-score">30</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverBox" class="hidden">
      <h2>😵 เกมจบแล้ว!</h2>
      <p>คะแนนสูงสุดที่ทำได้: <b><span id="finalScore">0</span></b></p>
      <button id="restartBtn">🔁 เล่นใหม่</button>
      <h3>🏆 อันดับคะแนนสูงสุด</h3>
      <ol id="leaderboardList"></ol>
    </div>
  </div>
  <p class="hint">เลื่อนเมาส์ / ลากนิ้ว เพื่อรับผัก 🥕 หลบหนอน 🐛 (คะแนนเหลือ 0 = แพ้)</p>
</div>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL = "https://liuetggqgvhyfyjdjuck.supabase.co";
const SUPABASE_KEY = "sb_publishable_dGq6ZrgoxcooBoT2-Y7-GQ_DODw_Deh";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

/* ================= Login ================= */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  const name = document.getElementById('username-input').value.trim();
  const errBox = document.getElementById('login-error');
  if (!name) { errBox.textContent = 'กรุณาใส่ชื่อผู้เล่นก่อนครับ'; return; }
  errBox.textContent = '';
  currentUser = name;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  startGame();
}

/* ================= เกม ================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GOOD_ITEMS = ['🥕','🥦','🍅','🥒','🌽','🥬','🍆'];
const BAD_ITEMS  = ['🐛','🪱','🤢'];

let items = [], score = 30, peakScore = 30, mouseX = 0;
let gameRunning = false, elapsedTime = 0, spawnTimer = 0;
let spawnInterval = 900, lastTime = 0;

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
});
canvas.addEventListener('touchmove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left;
}, { passive: true });

function spawnItem() {
  const badChance = Math.min(0.5, elapsedTime / 40000);
  const isBad = elapsedTime > 10000 && Math.random() < badChance;
  const emoji = isBad
    ? BAD_ITEMS[Math.floor(Math.random() * BAD_ITEMS.length)]
    : GOOD_ITEMS[Math.floor(Math.random() * GOOD_ITEMS.length)];
  items.push({
    x: Math.random() * (canvas.width - 40) + 20,
    y: -30,
    speed: 2 + Math.random() * 2 + elapsedTime / 15000,
    emoji, bad: isBad
  });
}

function charX() {
  return Math.max(0, Math.min(mouseX - 20, canvas.width - 40));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '32px serif';
  items.forEach(it => ctx.fillText(it.emoji, it.x, it.y));
  ctx.font = '40px serif';
  ctx.fillText('🧑‍🌾', charX(), canvas.height - 20);
}

function updateHUD() {
  document.getElementById('hud-score').textContent = score;
}

function checkCollisions() {
  const cx = charX() + 20;
  const cy = canvas.height - 30;
  items = items.filter(it => {
    if (Math.abs(it.x - cx) < 34 && Math.abs(it.y - cy) < 34) {
      score += it.bad ? -15 : 10;
      if (score < 0) score = 0;
      peakScore = Math.max(peakScore, score);
      updateHUD();
      if (score <= 0) endGame();
      return false;
    }
    return it.y < canvas.height + 40;
  });
}

function gameLoop(ts) {
  if (!gameRunning) return;
  const dt = ts - lastTime;
  lastTime = ts;
  elapsedTime += dt;
  spawnTimer += dt;

  spawnInterval = Math.max(300, 900 - elapsedTime / 60);
  if (spawnTimer > spawnInterval) { spawnItem(); spawnTimer = 0; }

  items.forEach(it => it.y += it.speed);
  draw();
  checkCollisions();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  resizeCanvas();
  score = 30; peakScore = 30; items = [];
  elapsedTime = 0; spawnTimer = 0;
  mouseX = canvas.width / 2;
  document.getElementById('hud-name').textContent = currentUser;
  updateHUD();
  document.getElementById('gameOverBox').classList.add('hidden');
  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

async function endGame() {
  if (!gameRunning) return;
  gameRunning = false;
  document.getElementById('finalScore').textContent = peakScore;
  document.getElementById('gameOverBox').classList.remove('hidden');
  try {
    await supabase.from('scores').insert({ username: currentUser, score: peakScore });
  } catch (e) { console.error('save score error', e); }
  loadLeaderboard();
}

async function loadLeaderboard() {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '<li>กำลังโหลด...</li>';
  const { data, error } = await supabase
    .from('scores').select('username, score')
    .order('score', { ascending: false }).limit(10);
  list.innerHTML = '';
  if (error || !data || !data.length) {
    list.innerHTML = '<li>ยังไม่มีคะแนน</li>';
    return;
  }
  data.forEach(row => {
    const li = document.createElement('li');
    li.textContent = `${row.username} — ${row.score} แต้ม`;
    list.appendChild(li);
  });
}

document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
